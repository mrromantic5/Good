<!DOCTYPE html>
<html lang="en">
<head>
{{HEAD}}
<title>Watch — CineFliX</title>
<meta name="description" content="Watch on CineFliX — movies and series on ChatXAP.">
<script>
(function(){var CX=/^c\.x\.t-lyfe\.com\.ng$/i.test(location.hostname)?'/':'https://c.x.t-lyfe.com.ng/';
fetch(CX+'backend/auth_check.php',{credentials:'include',cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d.status==='restricted')location.replace(CX+'restricted.html')}).catch(function(){});})();
</script>
<script src="js/chatxap-avatar.js" defer></script>
</head>
<body>
<section class="title-hero" id="tHero">
  <div class="bg" id="tBg"></div>
  <div class="title-wrap">
    <div class="title-poster" id="tPoster"></div>
    <div>
      <h1 class="title-name" id="tName">&nbsp;</h1>
      <div class="genre-line" id="tGenres"></div>
      <div class="title-tags" id="tTags"></div>
      <p class="title-desc clamp" id="tDesc"></p>
      <button class="linkish" id="tMore" hidden>Read more</button>
      <div class="title-actions">
        <button class="btn btn-primary" id="tPlay" disabled><i data-ic="play"></i><span>Play</span></button>
        <button class="btn btn-ghost" id="tTrailer" hidden><i data-ic="trailer"></i><span class="lbl">Trailer</span></button>
        <button class="btn btn-ghost btn-icon" id="tList" aria-label="Save to My List"><i data-ic="bookmark-o"></i></button>
        <button class="btn btn-ghost btn-icon" id="tShare" aria-label="Share"><i data-ic="share"></i></button>
      </div>
    </div>
  </div>
</section>

<div class="layout">
  <div>
    <div class="player paused" id="player" tabindex="0" aria-label="Video player">
      <video id="video" playsinline preload="none"></video>
      <canvas class="freeze" id="freeze" aria-hidden="true"></canvas>
      <div class="player-poster" id="pPoster">
        <button class="big-play" id="pBig" aria-label="Play"><span class="disc"><i data-ic="play"></i></span><b id="pBigLabel">Play</b></button>
      </div>
      <div class="p-loading" id="pLoad"><div class="spinner"></div></div>
      <div class="p-state" id="pState"><div><h4 id="pStateH"></h4><p id="pStateP"></p><div class="row-btns" id="pStateBtns"></div></div></div>
      <div class="tap-hint l" id="tapL">−10s</div><div class="tap-hint r" id="tapR">+10s</div>
      <div class="ctrl" id="ctrl">
        <div class="ctrl-top"><span id="cTitle"></span><span class="ep" id="cEp"></span><span class="q-badge" id="qBadge" hidden></span></div>
        <div class="ctrl-mid">
          <button id="cBack" aria-label="Back 10 seconds"><i data-ic="back10"></i></button>
          <button class="pp" id="cPP" aria-label="Play or pause"><i data-ic="play"></i></button>
          <button id="cFwd" aria-label="Forward 10 seconds"><i data-ic="fwd10"></i></button>
        </div>
        <div class="ctrl-bot">
          <div class="seek" id="seek" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="seek-track"><div class="seek-buf" id="sBuf"></div><div class="seek-fill" id="sFill"></div><div class="seek-knob" id="sKnob"></div></div>
            <div class="seek-tip" id="sTip">0:00</div>
          </div>
          <div class="ctrl-row">
            <button class="cbtn" id="bPP" aria-label="Play or pause"><i data-ic="play"></i></button>
            <span class="cvol-wrap" style="display:flex;align-items:center"><button class="cbtn" id="bMute" aria-label="Mute"><i data-ic="vol-high"></i></button><span class="cvol"><input type="range" id="bVol" min="0" max="1" step="0.05" value="1" aria-label="Volume"></span></span>
            <span class="ctime"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></span>
            <span class="grow"></span>
            <button class="cbtn" id="bNext" hidden aria-label="Next episode"><i data-ic="next"></i></button>
            <button class="cbtn" id="bSub" hidden aria-label="Subtitles"><i data-ic="cc"></i></button>
            <button class="cbtn txt" id="bSet" aria-label="Quality, picture and speed"><i data-ic="gear"></i>&nbsp;<span id="bSetLbl">Auto</span></button>
            <button class="cbtn" id="bPip" hidden aria-label="Picture in picture"><i data-ic="pip"></i></button>
            <button class="cbtn" id="bFs" aria-label="Full screen"><i data-ic="expand"></i></button>
          </div>
        </div>
      </div>
      <div class="menu" id="mSet"></div>
      <div class="menu" id="mSub"></div>
      <div class="next-up" id="nextUp"><div><small>Next episode in <span id="nextCount">8</span>s</small><b id="nextLbl"></b></div><button class="btn btn-sm btn-primary" id="nextGo">Play now</button><button class="btn btn-sm btn-ghost btn-icon" id="nextX" aria-label="Cancel"><i data-ic="x"></i></button></div>
    </div>

    <div class="panel" id="epPanel" hidden style="margin-top:16px">
      <div class="panel-head"><h3 class="h3">Episodes</h3><span class="section-sub" id="epCount"></span></div>
      <div class="seasons" id="seasons"></div>
      <div class="eps" id="eps"></div>
    </div>
    <div class="panel" id="dlPanel" hidden style="margin-top:16px">
      <div class="panel-head"><h3 class="h3">Download</h3><span class="section-sub" id="dlNote"></span></div>
      <div id="dlList"></div>
    </div>
  </div>
  <aside>
    <div class="panel" id="infoPanel">
      <div class="panel-head"><h3 class="h3">About</h3></div>
      <dl id="facts" style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px"></dl>
      <div id="langWrap" hidden style="margin-top:16px"><div class="h3" style="font-size:14px;margin-bottom:8px">Audio language</div><div class="lang-row" id="langs"></div></div>
    </div>
    <div class="panel" id="cmtPanel"></div>
  </aside>
</div>
<div id="castSlot"></div>
<div id="recSlot"></div>
<div id="footSlot"></div>
<div class="sheet-bd" id="sheet" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-grip"></div><div id="sheetBody"></div></div></div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous" defer></script>
<script src="/js/chatxap-realtime-client.js" defer></script>
<script type="module" src="{{JS}}"></script>
</body>
</html>
